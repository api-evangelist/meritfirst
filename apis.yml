aid: meritfirst
name: Meritfirst
description: >-
  MeritFirst is a skills-based hiring platform that replaces resume- and
  credential-based recruiting with practical, real-world assessments. Candidates
  prove their craft through work samples (Build, Try, Get Seen) and companies
  evaluate and match them on demonstrated ability rather than pedigree.
  MeritFirst exposes a hosted, authenticated Model Context Protocol (MCP) server
  so agents and tools can manage assessments, review candidates, and analyze
  hiring data. Backed by 8VC and Slow Ventures.
